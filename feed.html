<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PAGOCODE FEED</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: black; font-family: 'Poppins', sans-serif; overflow: hidden; }

        #muroReportes {
            height: 100vh; overflow-y: scroll;
            scroll-snap-type: y mandatory; scrollbar-width: none;
        }
        #muroReportes::-webkit-scrollbar { display: none; }

        .social-card {
            height: 100vh; width: 100vw;
            position: relative; scroll-snap-align: start;
            scroll-snap-stop: always; background: black;
        }

        .card-media { position: absolute; inset: 0; z-index: 1; }
        .vid-frame { width: 100%; height: 100%; }

        /* UI OVERLAY */
        .card-overlay {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 40%);
        }

        .user-info { pointer-events: auto; margin-bottom: 60px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .card-actions {
            position: absolute; bottom: 120px; right: 15px;
            display: flex; flex-direction: column; gap: 22px; z-index: 20;
        }

        .action-btn {
            background: none; border: none; color: white;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            cursor: pointer; font-size: 1.8rem; transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.8); }
        .action-btn span { font-size: 0.75rem; font-weight: 800; text-shadow: 0 2px 5px black; }
        
        /* Corazón Rojo */
        .liked { color: #ef4444 !important; }

        /* Botón Sonido Central */
        .unmute-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; pointer-events: auto;
            background: rgba(0,0,0,0.6); padding: 20px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5); color: white;
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="muroReportes"></div>

<script>
    // 1. CONFIGURACIÓN
    const firebaseConfig = {
        apiKey: "AIzaSyBiie8OxnerNy90uRARuPnr0Vr3D017R4A",
        authDomain: "ingresos-minimos.firebaseapp.com",
        databaseURL: "https://ingresos-minimos-default-rtdb.firebaseio.com",
        projectId: "ingresos-minimos",
        storageBucket: "ingresos-minimos.firebasestorage.app",
        messagingSenderId: "104886265441",
        appId: "1:104886265441:web:2272d88ad1129919ea6c20"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const idAuditor = urlParams.get('uid'); // Recibido desde la APK
    let audioActivado = false;
    let videoActual = null;

    // 2. CARGAR MURO
    function cargarMuro() {
        const container = document.getElementById('muroReportes');
        db.ref('reportes').orderByChild('fecha').limitToLast(25).on('value', snap => {
            if(!snap.exists()) return;
            container.innerHTML = "";
            let posts = [];
            snap.forEach(child => { posts.push({key: child.key, ...child.val()}); });
            posts.reverse().forEach(post => {
                const div = document.createElement('div');
                div.className = 'social-card';
                div.id = post.key;
                div.setAttribute('data-yt', getYouTubeID(post.musica));
                
                const isLiked = post.likes && idAuditor && post.likes[idAuditor];
                const numComments = post.comentarios ? Object.keys(post.comentarios).length : 0;

                div.innerHTML = `
                    <div class="card-media"><div class="vid-frame"></div></div>
                    <div class="card-overlay">
                        <div class="user-info">
                            <h4 style="font-weight:800;">@${post.autorClave || 'Usuario'}</h4>
                            <p>${post.texto || ''}</p>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="action-btn" onclick="toggleLike('${post.key}', '${post.uid}')">
                            <i class="fas fa-heart ${isLiked ? 'liked' : ''}"></i>
                            <span>${post.vCount || 0}</span>
                        </button>
                        <button class="action-btn" onclick="abrirComentariosApp('${post.key}')">
                            <i class="fas fa-comment-dots"></i>
                            <span>${numComments}</span>
                        </button>
                        <button class="action-btn" onclick="compartir('${getYouTubeID(post.musica)}')">
                            <i class="fas fa-share"></i>
                            <span>Share</span>
                        </button>
                    </div>
                    ${!audioActivado ? `
                    <div class="unmute-box" onclick="activarAudioGlobal()">
                        <i class="fas fa-volume-mute" style="font-size:2rem;"></i>
                        <small style="margin-top:5px; font-weight:bold;">SONIDO</small>
                    </div>` : ''}
                `;
                container.appendChild(div);
            });
            observarVideos();
        });
    }

    // 3. LÓGICA DE LIKES
    window.toggleLike = (postKey, ownerUid) => {
        if (!idAuditor) return alert("Inicia sesión");
        const ref = db.ref(`reportes/${postKey}/likes/${idAuditor}`);
        const countRef = db.ref(`reportes/${postKey}/vCount`);

        ref.once('value', s => {
            if (s.exists()) {
                ref.remove();
                countRef.transaction(c => (c || 0) - 1);
            } else {
                ref.set(true);
                countRef.transaction(c => (c || 0) + 1);
                // Enviar señal de sonido a la APK (opcional)
                window.parent.postMessage({type: 'playSelect'}, '*');
            }
        });
    };

    // 4. LÓGICA COMENTARIOS (PUENTE HACIA APK)
    window.abrirComentariosApp = (postKey) => {
        // Enviamos un mensaje a la APK para que abra su modal nativo
        window.parent.postMessage({type: 'openComments', key: postKey}, '*');
    };

    // 5. REPRODUCTOR
    function observarVideos() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) reproducirVideo(entry.target);
            });
        }, { threshold: 0.7 });
        document.querySelectorAll('.social-card').forEach(card => observer.observe(card));
    }

    function reproducirVideo(card) {
        if (videoActual === card.id) return;
        if (videoActual) {
            const ant = document.getElementById(videoActual);
            if(ant) ant.querySelector('.vid-frame').innerHTML = "";
        }
        videoActual = card.id;
        const ytId = card.getAttribute('data-yt');
        card.querySelector('.vid-frame').innerHTML = `
            <iframe width="100%" height="100%" 
                src="https://www.youtube.com/embed/${ytId}?autoplay=1&controls=0&modestbranding=1&rel=0&enablejsapi=1&origin=https://localhost&mute=${audioActivado ? 0 : 1}" 
                frameborder="0" allow="autoplay; encrypted-media">
            </iframe>`;
    }

    window.activarAudioGlobal = () => {
        audioActivado = true;
        cargarMuro(); // Recarga para aplicar sonido
    };

    function getYouTubeID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    window.compartir = (id) => { window.open("https://youtu.be/"+id, "_blank"); };

    window.onload = cargarMuro;
</script>
</body>
</html>
