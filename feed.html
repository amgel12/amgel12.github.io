<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PAGOCODE PREMIUM FEED</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Scripts de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #000; font-family: 'Poppins', sans-serif; overflow: hidden; }
        #muroReportes { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; background: #000; }
        #muroReportes::-webkit-scrollbar { display: none; }
        .social-card { height: 100vh; width: 100vw; position: relative; scroll-snap-align: start; scroll-snap-stop: always; background: #000; display: flex; align-items: center; justify-content: center; }
        .card-media { position: absolute; inset: 0; z-index: 1; }
        .vid-frame { width: 100%; height: 100%; pointer-events: none; }
        .card-overlay { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, rgba(0,0,0,0.3) 100%); pointer-events: none; }
        .user-info { pointer-events: auto; margin-bottom: 60px; color: #fff; max-width: 80%; }
        .user-info h4 { font-size: 1rem; font-weight: 800; margin-bottom: 5px; color: #3b82f6; }
        .user-info p { font-size: 0.9rem; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .card-actions { position: absolute; bottom: 300px; right: 12px; display: flex; flex-direction: column; align-items: center; gap: 22px; z-index: 30; pointer-events: auto; }
        .action-btn { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 1.9rem; text-shadow: 0 2px 8px rgba(0,0,0,0.8); transition: transform 0.2s; }
        .action-btn:active { transform: scale(0.8); }
        .action-btn span { font-size: 0.75rem; font-weight: 800; }
        .liked { color: #ef4444 !important; animation: pop 0.3s ease; }
        @keyframes pop { 0% {transform: scale(1);} 50% {transform: scale(1.4);} 100% {transform: scale(1);} }
        .unmute-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); color: #fff; display: flex; flex-direction: column; align-items: center; cursor: pointer; pointer-events: auto; backdrop-filter: blur(4px); }
        .nuevo-badge { position: absolute; top: 80px; right: 12px; z-index: 40; background: #ef4444; color: white; font-size: 0.6rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; animation: pulse 1.5s ease infinite; pointer-events: none; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        /* Loader */
        .loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; z-index: 200; }
    </style>
</head>
<body>
    <div id="muroReportes">
        <div class="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Cargando Feed...</div>
    </div>

<script>
    // Configuración Firebase (Asegúrate que sea la misma que en index.html)
    const firebaseConfig = {
        apiKey: "AIzaSyBiie8OxnerNy90uRARuPnr0Vr3D017R4A",
        authDomain: "ingresos-minimos.firebaseapp.com",
        databaseURL: "https://ingresos-minimos-default-rtdb.firebaseio.com",
        projectId: "ingresos-minimos",
        storageBucket: "ingresos-minimos.firebasestorage.app",
        messagingSenderId: "104886265441",
        appId: "1:104886265441:web:2272d88ad1129919ea6c20"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Obtener UID de la URL (?uid=...)
    const urlParams = new URLSearchParams(window.location.search);
    const idAuditor = urlParams.get('uid');
    
    let audioActivado = false;
    let videoActualId = null;
    let observerFeed = null;
    let primerCarga = true;

    // ✅ FUNCIÓN EXTRAER ID YOUTUBE (Corregida para Shorts y links normales)
    function getYouTubeID(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function crearCard(post, ytId) {
        const card = document.createElement('div');
        card.className = 'social-card';
        card.id = post.key;
        card.setAttribute('data-yt', ytId);
        card.setAttribute('data-uid', post.uid || '');
        
        const isLiked = post.likes && idAuditor && post.likes[idAuditor];
        const numComments = post.comentarios ? Object.keys(post.comentarios).length : 0;
        
        card.innerHTML = `
            <div class="card-media"><div class="vid-frame"></div></div>
            <div class="card-overlay">
                <div class="user-info">
                    <h4>@${post.autorClave || 'Usuario'}</h4>
                    <p>${post.texto || ''}</p>
                </div>
            </div>
            <div class="card-actions">
                <button class="action-btn" onclick="toggleLike('${post.key}', '${post.uid}')">
                    <i class="fas fa-heart ${isLiked ? 'liked' : ''}"></i>
                    <span id="l-count-${post.key}">${post.vCount || 0}</span>
                </button>
                <button class="action-btn" onclick="abrirComentariosApp('${post.key}')">
                    <i class="fas fa-comment-dots"></i>
                    <span>${numComments}</span>
                </button>
            </div>
            ${!audioActivado ? `
            <div class="unmute-box" onclick="activarAudioGlobal()">
                <i class="fas fa-play" style="font-size:2.5rem; margin-left:8px;"></i>
                <small style="margin-top:8px; font-weight:800; letter-spacing:1px;">TOCA PARA SONIDO</small>
            </div>` : ''}
        `;
        return card;
    }

    function iniciarObservador() {
        if (observerFeed) observerFeed.disconnect();
        observerFeed = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    reproducirVideo(entry.target);
                }
            });
        }, { threshold: 0.6 }); // Se activa cuando el 60% del video es visible
        
        document.querySelectorAll('.social-card').forEach(c => observerFeed.observe(c));
    }

    function cargarMuro() {
        const container = document.getElementById('muroReportes');
        // Limpiar loader inicial si existe
        const loader = container.querySelector('.loader');
        if(loader) loader.style.display = 'none';

        db.ref('reportes').limitToLast(25).on('value', snap => {
            if (!snap.exists()) {
                container.innerHTML = "<div style='color:white;text-align:center;padding-top:50vh;'>No hay videos aún</div>";
                return;
            }

            const postsMap = {};
            snap.forEach(child => { postsMap[child.key] = {key: child.key, ...child.val()}; });
            
            // Eliminar cards que ya no existen en BD (opcional, para limpieza)
            const latestKeys = new Set(Object.keys(postsMap));
            container.querySelectorAll('.social-card').forEach(el => {
                if (!latestKeys.has(el.id) && el.id !== videoActualId) el.remove();
            });

            let huboNuevos = false;
            snap.forEach(child => {
                if (document.getElementById(child.key)) return; // Ya existe
                
                const post = {key: child.key, ...child.val()};
                const ytId = getYouTubeID(post.musica);
                
                if (!ytId) return; // Saltar si no es video válido

                const card = crearCard(post, ytId);
                
                if (primerCarga) { 
                    container.appendChild(card); 
                } else {
                    // Efecto "NUEVO" para posts recientes
                    const badge = document.createElement('div');
                    badge.className = 'nuevo-badge';
                    badge.textContent = 'NUEVO';
                    card.appendChild(badge);
                    container.insertBefore(card, container.firstChild);
                }
                huboNuevos = true;
            });

            // Ordenar solo en la primera carga
            if (primerCarga && !huboNuevos) {
                const cards = Array.from(container.querySelectorAll('.social-card'));
                cards.sort((a, b) => {
                    const fa = postsMap[a.id]?.fecha || 0;
                    const fb = postsMap[b.id]?.fecha || 0;
                    return fb - fa; // Más reciente primero
                });
                cards.forEach(c => container.appendChild(c));
            }

            // Limitar cantidad de DOM elements para rendimiento
            while (container.children.length > 30) {
                const last = container.lastChild;
                if (last.id === videoActualId) break; // No borrar el que se está viendo
                last.remove();
            }

            iniciarObservador();
            primerCarga = false;
        });
    }

    function reproducirVideo(card) {
        if (videoActualId === card.id) return; // Ya se está reproduciendo
        
        // Pausar anterior
        if (videoActualId) {
            const ant = document.getElementById(videoActualId);
            if (ant) {
                const frame = ant.querySelector('.vid-frame');
                if(frame) frame.innerHTML = ""; // Destruir iframe para parar audio
                // Opcional: Mostrar poster de nuevo si lo tuvieras
            }
        }

        videoActualId = card.id;
        const ytId = card.getAttribute('data-yt');
        const frame = card.querySelector('.vid-frame');
        
        if (!frame || !ytId) return;

        const muteState = audioActivado ? 0 : 1;
        
        // Inyectar iframe con autoplay
        frame.innerHTML = `
            <iframe width="100%" height="100%"
                src="https://www.youtube.com/embed/${ytId}?autoplay=1&controls=0&modestbranding=1&rel=0&enablejsapi=1&origin=${window.location.origin}&mute=${muteState}&playlist=${ytId}&loop=1"
                frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen>
            </iframe>`;
    }

    window.activarAudioGlobal = () => {
        audioActivado = true;
        document.querySelectorAll('.unmute-box').forEach(el => el.remove());
        // Reiniciar video actual sin mute
        const actual = document.getElementById(videoActualId);
        if (actual) { 
            videoActualId = null; 
            reproducirVideo(actual); 
        }
    };

    window.toggleLike = (postKey, ownerUid) => {
        if (!idAuditor) {
            alert("Debes iniciar sesión para dar like");
            return;
        }
        const ref = db.ref(`reportes/${postKey}/likes/${idAuditor}`);
        const countRef = db.ref(`reportes/${postKey}/vCount`);
        
        ref.once('value', s => {
            if (s.exists()) {
                // Quitar like
                ref.remove();
                countRef.transaction(c => (c || 0) - 1);
            } else {
                // Dar like
                ref.set(true);
                countRef.transaction(c => (c || 0) + 1);
                
                // Notificar al dueño (vía postMessage a la app padre si existe)
                if (window.parent && ownerUid && ownerUid !== idAuditor) {
                    window.parent.postMessage({
                        type: 'doLike', 
                        postKey: postKey, 
                        ownerUid: ownerUid
                    }, '*');
                }
            }
        });

        // Actualización visual inmediata (Optimista)
        const icon = document.querySelector(`#${postKey} .fa-heart`);
        const countSpan = document.getElementById(`l-count-${postKey}`);
        
        if (icon) {
            const isLiked = !icon.classList.contains('liked');
            if (isLiked) {
                icon.classList.add('liked');
                icon.style.color = '#ef4444';
                if(countSpan) countSpan.textContent = (parseInt(countSpan.textContent)||0) + 1;
            } else {
                icon.classList.remove('liked');
                icon.style.color = 'white';
                if(countSpan) countSpan.textContent = Math.max(0, (parseInt(countSpan.textContent)||0) - 1);
            }
        }
    };

    window.abrirComentariosApp = (postKey) => {
        if (window.parent) {
            window.parent.postMessage({type: 'openComments', key: postKey}, '*');
        } else {
            alert("Abriendo comentarios para: " + postKey);
        }
    };

    // Iniciar al cargar
    window.onload = cargarMuro;
</script>
</body>
</html>
