<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PAGOCODE PREMIUM FEED</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #000; font-family: 'Poppins', sans-serif; overflow: hidden; }
        #muroReportes { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; background: #000; }
        #muroReportes::-webkit-scrollbar { display: none; }
        .social-card { height: 100vh; width: 100vw; position: relative; scroll-snap-align: start; scroll-snap-stop: always; background: #000; display: flex; align-items: center; justify-content: center; }
        .card-media { position: absolute; inset: 0; z-index: 1; }
        .vid-frame { width: 100%; height: 100%; pointer-events: none; }
        .card-overlay { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, rgba(0,0,0,0.3) 100%); pointer-events: none; }
        .user-info { pointer-events: auto; margin-bottom: 60px; color: #fff; max-width: 80%; }
        .user-info h4 { font-size: 1rem; font-weight: 800; margin-bottom: 5px; color: #3b82f6; }
        .user-info p { font-size: 0.9rem; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .card-actions { position: absolute; bottom: 300px; right: 12px; display: flex; flex-direction: column; align-items: center; gap: 22px; z-index: 30; pointer-events: auto; }
        .action-btn { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 1.9rem; text-shadow: 0 2px 8px rgba(0,0,0,0.8); transition: transform 0.2s; }
        .action-btn:active { transform: scale(0.8); }
        .action-btn span { font-size: 0.75rem; font-weight: 800; }
        .liked { color: #ef4444 !important; animation: pop 0.3s ease; }
        @keyframes pop { 0% {transform: scale(1);} 50% {transform: scale(1.4);} 100% {transform: scale(1);} }
        .unmute-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); color: #fff; display: flex; flex-direction: column; align-items: center; cursor: pointer; pointer-events: auto; backdrop-filter: blur(4px); }
        .loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; z-index: 200; text-align: center; }
    </style>
</head>
<body>
    <div id="muroReportes">
        <div class="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Cargando Feed...</div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBiie8OxnerNy90uRARuPnr0Vr3D017R4A",
        authDomain: "ingresos-minimos.firebaseapp.com",
        databaseURL: "https://ingresos-minimos-default-rtdb.firebaseio.com",
        projectId: "ingresos-minimos",
        storageBucket: "ingresos-minimos.firebasestorage.app",
        messagingSenderId: "104886265441",
        appId: "1:104886265441:web:2272d88ad1129919ea6c20"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const idAuditor = urlParams.get('uid') || "anon";
    
    let audioActivado = false;
    let videoActualId = null;
    let observerFeed = null;

    function getYouTubeID(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function prepararObservador() {
        observerFeed = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) reproducirVideo(entry.target);
            });
        }, { threshold: 0.6 });
    }

    function cargarMuro() {
        console.log("Iniciando carga de videos...");
        const container = document.getElementById('muroReportes');
        prepararObservador();

        db.ref('reportes').limitToLast(15).on('child_added', snap => {
            try {
                const post = snap.val();
                if (!post || !post.musica) return; // Seguridad: Si no hay música, saltar

                const loader = document.querySelector('.loader');
                if(loader) loader.remove();

                let mediaLink = post.musica.includes('workers.dev') ? post.musica : getYouTubeID(post.musica);
                
                if (!mediaLink || document.getElementById(snap.key)) return;

                const card = crearCard(snap.key, post, mediaLink);
                container.prepend(card); 
                observerFeed.observe(card);
                console.log("Video añadido:", snap.key);
            } catch (e) {
                console.error("Error cargando post:", e);
            }
        }, error => {
            console.error("Error de Firebase:", error);
            alert("Error de permisos en Firebase. Revisa las reglas.");
        });

        db.ref('reportes').on('child_removed', snap => {
            const el = document.getElementById(snap.key);
            if (el) el.remove();
        });
    }

    function crearCard(key, post, mediaId) {
        const card = document.createElement('div');
        card.className = 'social-card';
        card.id = key;
        card.setAttribute('data-media', mediaId);
        card.setAttribute('data-uid', post.uid || '');
        
        const isLikedInitial = post.likes && idAuditor && post.likes[idAuditor];

        card.innerHTML = `
            <div class="card-media"><div class="vid-frame"></div></div>
            <div class="card-overlay">
                <div class="user-info">
                    <h4>@${post.autorClave || 'Usuario'}</h4>
                    <p>${post.texto || ''}</p>
                </div>
            </div>
            <div class="card-actions">
                <button class="action-btn" onclick="toggleLike('${key}', '${post.uid}')">
                    <i class="fas fa-heart ${isLikedInitial ? 'liked' : ''}" id="heart-${key}"></i>
                    <span id="l-count-${key}">${post.vCount || 0}</span>
                </button>
                <button class="action-btn" onclick="abrirComentariosApp('${key}')">
                    <i class="fas fa-comment-dots"></i>
                    <span id="c-count-${key}">${post.comentarios ? Object.keys(post.comentarios).length : 0}</span>
                </button>
            </div>
            ${!audioActivado ? `
            <div class="unmute-box" onclick="activarAudioGlobal()">
                <i class="fas fa-play" style="font-size:2.5rem; margin-left:8px;"></i>
                <small style="margin-top:8px; font-weight:800; letter-spacing:1px;">TOCA PARA SONIDO</small>
            </div>` : ''}
        `;

        // Listeners individuales
        db.ref(`reportes/${key}/vCount`).on('value', s => {
            const el = document.getElementById(`l-count-${key}`);
            if(el) el.textContent = s.val() || 0;
        });

        db.ref(`reportes/${key}/likes/${idAuditor}`).on('value', s => {
            const heart = document.getElementById(`heart-${key}`);
            if (heart) {
                if (s.exists()) heart.classList.add('liked');
                else heart.classList.remove('liked');
            }
        });

        db.ref(`reportes/${key}/comentarios`).on('value', snap => {
            const el = document.getElementById(`c-count-${key}`);
            const count = snap.val() ? Object.keys(snap.val()).length : 0;
            if (el) el.textContent = count;
        });

        return card;
    }

    function reproducirVideo(card) {
        if (videoActualId === card.id) return;
        if (videoActualId) {
            const ant = document.getElementById(videoActualId);
            if (ant) ant.querySelector('.vid-frame').innerHTML = "";
        }
        videoActualId = card.id;
        const linkMedia = card.getAttribute('data-media'); 
        const frame = card.querySelector('.vid-frame');

        if (window.parent) {
            window.parent.postMessage({type: 'startVideoProgress', videoId: linkMedia}, '*');
        }
        
        if (linkMedia.includes('workers.dev')) {
            frame.innerHTML = `<video width="100%" height="100%" autoplay loop playsinline ${audioActivado ? '' : 'muted'} style="object-fit: cover; background: #000; width:100%; height:100%;"><source src="${linkMedia}" type="video/mp4"></video>`;
        } else {
            const muteState = audioActivado ? 0 : 1;
            // 🔥 TRUCO: Forzamos el ORIGIN y el WIDGET_REFERRER para saltar bloqueos de dominio
            const origin = "https://amgel12.github.io"; 
            
            frame.innerHTML = `<iframe 
                width="100%" 
                height="100%" 
                src="https://www.youtube.com/embed/${linkMedia}?autoplay=1&controls=0&modestbranding=1&rel=0&enablejsapi=1&origin=${origin}&widget_referrer=${origin}&mute=${muteState}&playlist=${linkMedia}&loop=1" 
                frameborder="0" 
                allow="autoplay; encrypted-media; picture-in-picture" 
                allowfullscreen 
                style="width:100%; height:100%; object-fit:cover;"></iframe>`;
        }
    }
    window.activarAudioGlobal = () => {
        audioActivado = true;
        document.querySelectorAll('.unmute-box').forEach(el => el.remove());
        const actual = document.getElementById(videoActualId);
        if (actual) { videoActualId = null; reproducirVideo(actual); }
    };

    window.toggleLike = (postKey, ownerUid) => {
    if (!idAuditor || idAuditor === "anon") return alert("Inicia sesión");
    
    const ref = db.ref(`reportes/${postKey}/likes/${idAuditor}`);
    const countRef = db.ref(`reportes/${postKey}/vCount`);

    // 🔥 EFECTO VISUAL INMEDIATO (Antes de ir a Firebase)
    const icon = document.getElementById(`heart-${postKey}`);
    const countSpan = document.getElementById(`l-count-${postKey}`);
    
    ref.once('value', s => {
        if (s.exists()) {
            // QUITAR LIKE
            ref.remove();
            countRef.transaction(c => (c || 0) - 1);
            if(icon) icon.classList.remove('liked'); // Se pone blanco
        } else {
            // DAR LIKE
            ref.set(true);
            countRef.transaction(c => (c || 0) + 1);
            if(icon) icon.classList.add('liked'); // Se pone rojo
            
            window.parent.postMessage({type: 'playSelect'}, '*');
            
            // 🔥 SI EL DUEÑO EXISTE, AVISAR AL INDEX.HTML
            if (window.parent && ownerUid && ownerUid !== idAuditor) {
                window.parent.postMessage({
                    type: 'doLike', 
                    postKey: postKey, 
                    ownerUid: ownerUid
                }, '*');
            }
        }
    });
};
    window.abrirComentariosApp = (postKey) => {
        const count = document.getElementById(`c-count-${postKey}`)?.textContent || '0';
        if (window.parent) window.parent.postMessage({type: 'openComments', key: postKey, count: count}, '*');
    };

    window.detenerVideoMuro = function() {
        if (videoActualId) {
            const ant = document.getElementById(videoActualId);
            if (ant) ant.querySelector('.vid-frame').innerHTML = "";
            videoActualId = null;
        }
    };

    window.addEventListener('message', function(event) {
        if (event.data.type === 'detenerVideoMuro' || event.data.type === 'stopAllVideos') {
            window.detenerVideoMuro();
        }
        if (event.data.type === 'updateCommentCount') {
            const el = document.getElementById(`c-count-${event.data.key}`);
            if (el) el.textContent = event.data.count || 0;
        }
        if (event.data.type === 'scroll_to_post') {
            const vid = document.getElementById(event.data.postId);
            const container = document.getElementById('muroReportes');
            if (vid && container) {
                container.style.scrollSnapType = "none";
                vid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                vid.style.transition = "0.5s";
                vid.style.outline = "6px solid #3b82f6";
                vid.style.outlineOffset = "-6px";
                setTimeout(() => {
                    container.style.scrollSnapType = "y mandatory";
                    vid.style.outline = "none";
                }, 2500);
            }
        }
    });

    window.onload = cargarMuro;
</script>
</body>
</html>
