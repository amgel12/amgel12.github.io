<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PAGOCODE</title>
  <script>
    window.onload = function () {
      const appScheme = "pagocode://open";
      const playStore = "https://play.google.com/store/apps/details?id=com.pagocode.app";

      const start = Date.now();

      window.location.href = appScheme;

      setTimeout(() => {
        if (Date.now() - start < 2000) {
          window.location.href = playStore;
        }
      }, 1500);
    };
  </script>
</head>
<body>
  <p>Abriendo PAGOCODE...</p>
</body>
</html>
